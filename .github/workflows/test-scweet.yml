
name: Test Scweet

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Scweet
        run: |
          python -m pip install --upgrade pip
          pip install "Scweet==5.8.1"

      - name: Test X scraper
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: python src/test_scweet.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scweet-results
          path: data/scweet_posts.json
          if-no-files-found: ignore
