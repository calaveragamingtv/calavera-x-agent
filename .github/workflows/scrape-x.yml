
name: Scrape and Analyze X Posts

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize executions to protect shared repository state.
concurrency:
  group: x-agent-scrape
  cancel-in-progress: false

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Check whether another execution is needed.
      - name: Check execution eligibility
        id: execution
        run: python -m src.execution_controller

      # 2. Install Node.js only when execution is authorized.
      - name: Set up Node.js
        if: steps.execution.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Install Rettiwt.
      - name: Install Rettiwt
        if: steps.execution.outputs.should_run == 'true'
        run: npm install --no-save --no-package-lock rettiwt-api@7.1.4

      # 4. Retrieve X posts.
      - name: Scrape X with Rettiwt
        if: steps.execution.outputs.should_run == 'true'
        env:
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
          ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.ACCOUNTS_ENCRYPTION_KEY }}
        run: node src/test_rettiwt.mjs

      # 5. Install Python.
      - name: Set up Python
        if: steps.execution.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install Python dependencies
        if: steps.execution.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      # 6. Analyze posts.
      - name: Run X Agent
        if: steps.execution.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
        run: python -m src.main

      # 7. Persist execution state and generated data.
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update X agent data"
            git push
          fi
