
name: Scrape and Analyze X Posts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run X Agent
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_ACCOUNT_USERNAME: ${{ secrets.X_ACCOUNT_USERNAME }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python -m src.main

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/posts.json data/ranking.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update X posts and ranking"
            git push
          fi
