
name: Scrape and Analyze X Posts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

# Prevent two executions from modifying the tracker simultaneously.
concurrency:
  group: x-agent-scrape
  cancel-in-progress: false

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 2. Install Rettiwt without requiring package.json
      - name: Install Rettiwt
        run: npm install --no-save --no-package-lock rettiwt-api@7.1.4

      # 3. Retrieve X posts
      - name: Scrape X with Rettiwt
        env:
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
          ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.ACCOUNTS_ENCRYPTION_KEY }}
        run: node src/test_rettiwt.mjs

      # 4. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      # 5. Analyze new posts
      - name: Run X Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
        run: python -m src.main

      # 6. Persist tracker and generated data
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update X agent data"
            git push
          fi
