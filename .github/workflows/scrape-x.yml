name: Publish X Reply

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "ID de la publicación de X"
        required: true
        type: string

      reply_text:
        description: "Texto de la respuesta"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r src/requeriments.txt
          python -m playwright install --with-deps chromium

      - name: Publish reply
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TARGET_POST_ID: ${{ inputs.post_id }}
          REPLY_TEXT: ${{ inputs.reply_text }}
        run: python src/publisher.py
