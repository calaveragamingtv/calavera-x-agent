
name: Scrape and Analyze X Posts

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize executions to protect shared repository state.
concurrency:
  group: x-agent-scrape
  cancel-in-progress: false

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Register every incoming call and decide whether to execute.
      - name: Prepare execution
        id: execution
        run: python -m src.execution_controller prepare

      - name: Set up Node.js
        if: steps.execution.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rettiwt
        if: steps.execution.outputs.should_run == 'true'
        run: npm install --no-save --no-package-lock rettiwt-api@7.1.4

      - name: Scrape X with Rettiwt
        id: scrape
        if: steps.execution.outputs.should_run == 'true'
        env:
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
          ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.ACCOUNTS_ENCRYPTION_KEY }}
        run: node src/test_rettiwt.mjs

      - name: Install Python dependencies
        if: steps.execution.outputs.should_run == 'true' && steps.scrape.outcome == 'success'
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      # Consume the execution quota immediately before main starts.
      - name: Start execution
        id: start
        if: steps.execution.outputs.should_run == 'true' && steps.scrape.outcome == 'success'
        run: python -m src.execution_controller start

      - name: Run X Agent
        if: steps.execution.outputs.should_run == 'true' && steps.start.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
        run: python -m src.main

      # Release the reservation if main was never started.
      - name: Cancel execution reservation
        if: always() && steps.execution.outputs.should_run == 'true' && steps.start.outcome != 'success'
        run: python -m src.execution_controller cancel

      # Persist call counters, execution records and generated data.
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update X agent data"
            git push
          fi
