
name: Add Monitored Account

on:
  workflow_dispatch:
    inputs:
      username:
        description: "X username (without @)"
        required: true
        type: string

      account_type:
        description: "Account category"
        required: true
        type: choice
        options:
          - streamer
          - server
          - official
          - company
          - creator
          - other

permissions:
  contents: write

jobs:
  add-account:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Encrypt and register account
        env:
          ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.ACCOUNTS_ENCRYPTION_KEY }}
          ACCOUNT_USERNAME: ${{ inputs.username }}
          ACCOUNT_TYPE: ${{ inputs.account_type }}
        run: python -m src.tools.encrypt_accounts

      - name: Commit account
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/monitored_accounts.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add encrypted monitored account"
            git push
          fi
