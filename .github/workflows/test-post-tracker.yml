
name: Test Post Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-post-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PostTracker tests
        run: python -m unittest discover -s src/tests -p "test_*.py" -v
