
name: Test twscrape

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir twscrape curl-cffi

      - name: Test X scraper
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_ACCOUNT_USERNAME: ${{ secrets.X_ACCOUNT_USERNAME }}
          TWS_HTTP_BACKEND: curl
        run: python src/test_twscrape.py
